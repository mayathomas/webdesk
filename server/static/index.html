<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>远程桌面控制 - WebRTC版本</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🌐 远程桌面控制 (WebRTC)</h1>
            <p>使用WebRTC P2P技术进行低延迟远程控制</p>
        </div>

        <div id="loginSection">
            <div class="login-form">
                <div class="form-group">
                    <label for="clientId">客户端ID:</label>
                    <input type="text" id="clientId" placeholder="请输入客户端ID" />
                </div>
                <div class="form-group">
                    <label for="authCode">验证码:</label>
                    <input type="password" id="authCode" placeholder="请输入验证码" />
                </div>
                <button class="btn btn-primary" onclick="connect()">开始WebRTC连接</button>
            </div>
        </div>

        <div id="status" class="status" style="display: none;"></div>

        <div id="connectionInfo" class="connection-info" style="display: none;">
            <div>🔗 连接状态: <span id="connectionState">未连接</span></div>
            <div>📡 信令状态: <span id="signalingState">未连接</span></div>
            <div>🧊 ICE状态: <span id="iceState">未连接</span></div>
            <div>📊 数据通道: <span id="dataChannelState">未连接</span></div>
        </div>

        <div id="remoteDesktop" class="remote-desktop">
            <div class="desktop-container">
                <canvas id="desktopCanvas" class="desktop-screen"></canvas>
                <div id="loading" class="loading">正在建立WebRTC连接...</div>
            </div>
            <div class="controls">
                <button class="btn btn-danger" onclick="disconnect()">断开连接</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
