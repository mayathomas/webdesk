<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>远程桌面控制</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            padding: 2rem;
            width: 90%;
            max-width: 1200px;
        }

        .header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .header h1 {
            color: #333;
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
        }

        .header p {
            color: #666;
            font-size: 1.1rem;
        }

        .login-form {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            max-width: 400px;
            margin: 0 auto 2rem;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            margin-bottom: 0.5rem;
            color: #333;
            font-weight: 600;
        }

        .form-group input {
            padding: 0.75rem;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.3s ease;
        }

        .form-group input:focus {
            outline: none;
            border-color: #667eea;
        }

        .btn {
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        .btn-danger {
            background: linear-gradient(135deg, #ff6b6b 0%, #ee5a52 100%);
            color: white;
        }

        .btn-danger:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(255, 107, 107, 0.3);
        }

        .status {
            text-align: center;
            margin: 1rem 0;
            padding: 0.75rem;
            border-radius: 8px;
            font-weight: 600;
        }

        .status.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .status.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .remote-desktop {
            display: none;
            text-align: center;
        }

        .remote-desktop.active {
            display: block;
        }

        .desktop-container {
            position: relative;
            background: #000;
            border-radius: 8px;
            overflow: hidden;
            margin: 1rem 0;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .desktop-screen {
            width: 100%;
            height: auto;
            display: block;
            cursor: crosshair;
        }

        .loading {
            padding: 2rem;
            color: #666;
            font-size: 1.2rem;
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 1rem;
            margin-top: 1rem;
        }

        @media (max-width: 768px) {
            .container {
                padding: 1rem;
                margin: 1rem;
            }

            .header h1 {
                font-size: 2rem;
            }

            .controls {
                flex-direction: column;
                align-items: center;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🖥️ 远程桌面控制</h1>
            <p>输入客户端ID和验证码来远程控制桌面</p>
        </div>

        <div id="loginSection">
            <div class="login-form">
                <div class="form-group">
                    <label for="clientId">客户端ID:</label>
                    <input type="text" id="clientId" placeholder="请输入客户端ID" />
                </div>
                <div class="form-group">
                    <label for="authCode">验证码:</label>
                    <input type="password" id="authCode" placeholder="请输入验证码" />
                </div>
                <button class="btn btn-primary" onclick="connect()">连接</button>
            </div>
        </div>

        <div id="status" class="status" style="display: none;"></div>

        <div id="remoteDesktop" class="remote-desktop">
            <div class="desktop-container">
                <canvas id="desktopCanvas" class="desktop-screen"></canvas>
                <div id="loading" class="loading">正在连接远程桌面...</div>
            </div>
            <div class="controls">
                <button class="btn btn-danger" onclick="disconnect()">断开连接</button>
            </div>
        </div>
    </div>

    <script>
        let ws = null;
        let canvas = null;
        let ctx = null;
        let isConnected = false;

        // 用于存储完整的桌面图像和差分更新
        let desktopCanvas = null;
        let desktopCtx = null;

        function showStatus(message, type = 'success') {
            const status = document.getElementById('status');
            status.textContent = message;
            status.className = `status ${type}`;
            status.style.display = 'block';
            
            setTimeout(() => {
                status.style.display = 'none';
            }, 3000);
        }

        function connect() {
            const clientId = document.getElementById('clientId').value.trim();
            const authCode = document.getElementById('authCode').value.trim();

            if (!clientId || !authCode) {
                showStatus('请输入客户端ID和验证码', 'error');
                return;
            }

            // 连接WebSocket服务器 - 使用/ws路径
            const wsUrl = `ws://${window.location.host}/ws`;
            ws = new WebSocket(wsUrl);

            ws.onopen = function() {
                console.log('WebSocket连接已建立');
                
                // 发送浏览器连接请求
                const connectRequest = {
                    type: 'BrowserConnect',
                    client_id: clientId,
                    auth_code: authCode
                };
                
                console.log('发送连接请求:', connectRequest);
                ws.send(JSON.stringify(connectRequest));
            };

            ws.onmessage = function(event) {
                console.log('收到服务器消息:', event.data);
                try {
                    const message = JSON.parse(event.data);
                    handleMessage(message);
                } catch (e) {
                    console.error('解析消息失败:', e);
                }
            };

            ws.onclose = function() {
                console.log('WebSocket连接已关闭');
                if (isConnected) {
                    showStatus('连接已断开', 'error');
                    resetUI();
                }
            };

            ws.onerror = function(error) {
                console.error('WebSocket错误:', error);
                showStatus('连接失败', 'error');
            };
        }

        function handleMessage(message) {
            switch (message.type) {
                case 'Connected':
                    if (message.success) {
                        isConnected = true;
                        showStatus('连接成功', 'success');
                        showRemoteDesktop();
                        initCanvas();
                    } else {
                        showStatus(message.message, 'error');
                    }
                    break;

                case 'Error':
                    showStatus(message.message, 'error');
                    break;

                case 'ScreenData':
                    updateDesktop(message);
                    break;

                default:
                    console.log('未知消息类型:', message.type);
            }
        }

        function showRemoteDesktop() {
            document.getElementById('loginSection').style.display = 'none';
            document.getElementById('remoteDesktop').classList.add('active');
        }

        function initCanvas() {
            canvas = document.getElementById('desktopCanvas');
            ctx = canvas.getContext('2d');

            // 添加鼠标事件监听
            canvas.addEventListener('click', handleMouseClick);
            canvas.addEventListener('mousemove', handleMouseMove);
            canvas.addEventListener('contextmenu', e => e.preventDefault());
            
            // 添加键盘事件监听
            document.addEventListener('keydown', handleKeyDown);
            document.addEventListener('keyup', handleKeyUp);

            // 隐藏加载提示
            document.getElementById('loading').style.display = 'none';
        }

        function updateDesktop(screenData) {
            console.log('收到屏幕数据:', {
                width: screenData.width,
                height: screenData.height,
                format: screenData.format,
                fullFrame: screenData.full_frame,
                dataLength: screenData.image_data ? screenData.image_data.length : 0,
                changedRegions: screenData.changed_regions ? screenData.changed_regions.length : 0
            });
            
            // 初始化桌面画布（如果需要）
            if (!desktopCanvas) {
                desktopCanvas = document.createElement('canvas');
                desktopCtx = desktopCanvas.getContext('2d');
            }
            
            if (screenData.full_frame && screenData.image_data) {
                // 处理完整帧
                const img = new Image();
                img.onload = function() {
                    console.log('完整帧加载成功:', img.width, 'x', img.height, '格式:', screenData.format);
                    
                    // 更新画布尺寸
                    canvas.width = screenData.width;
                    canvas.height = screenData.height;
                    desktopCanvas.width = screenData.width;
                    desktopCanvas.height = screenData.height;
                    
                    // 绘制到桌面画布
                    desktopCtx.drawImage(img, 0, 0);
                    
                    // 复制到显示画布
                    ctx.drawImage(desktopCanvas, 0, 0);
                    
                    console.log('完整帧已绘制到画布');
                };
                img.onerror = function() {
                    console.error('完整帧图像加载失败');
                };
                
                // 根据格式设置正确的数据URL
                const mimeType = screenData.format === 'jpeg' ? 'image/jpeg' : 'image/png';
                img.src = `data:${mimeType};base64,${screenData.image_data}`;
                
            } else if (screenData.changed_regions && screenData.changed_regions.length > 0) {
                // 处理差分更新
                console.log(`处理差分更新: ${screenData.changed_regions.length} 个区域`);
                
                let loadedRegions = 0;
                const totalRegions = screenData.changed_regions.length;
                
                screenData.changed_regions.forEach(region => {
                    const img = new Image();
                    img.onload = function() {
                        // 绘制到桌面画布的指定位置
                        desktopCtx.drawImage(img, region.x, region.y);
                        
                        loadedRegions++;
                        if (loadedRegions === totalRegions) {
                            // 所有区域加载完成，更新显示画布
                            ctx.drawImage(desktopCanvas, 0, 0);
                            console.log(`差分更新完成: ${totalRegions} 个区域`);
                        }
                    };
                    img.onerror = function() {
                        console.error('差分区域图像加载失败:', region);
                    };
                    
                    // 差分区域通常是JPEG格式
                    img.src = `data:image/jpeg;base64,${region.data}`;
                });
            } else {
                // 没有变化的帧，无需更新
                console.log('没有屏幕变化，跳过更新');
            }
        }

        function handleMouseClick(event) {
            if (!isConnected || !ws) return;

            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            
            const x = (event.clientX - rect.left) * scaleX;
            const y = (event.clientY - rect.top) * scaleY;

            const mouseEvent = {
                type: 'MouseEvent',
                x: x,
                y: y,
                button: event.button === 0 ? 'left' : (event.button === 2 ? 'right' : 'middle'),
                event_type: 'click'
            };

            ws.send(JSON.stringify(mouseEvent));
        }

        function handleMouseMove(event) {
            if (!isConnected || !ws) return;

            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            
            const x = (event.clientX - rect.left) * scaleX;
            const y = (event.clientY - rect.top) * scaleY;

            const mouseEvent = {
                type: 'MouseEvent',
                x: x,
                y: y,
                button: 'none',
                event_type: 'move'
            };

            ws.send(JSON.stringify(mouseEvent));
        }

        function handleKeyDown(event) {
            if (!isConnected || !ws) return;

            event.preventDefault();

            const keyboardEvent = {
                type: 'KeyboardEvent',
                key: event.code,
                event_type: 'press'
            };

            ws.send(JSON.stringify(keyboardEvent));
        }

        function handleKeyUp(event) {
            if (!isConnected || !ws) return;

            event.preventDefault();

            const keyboardEvent = {
                type: 'KeyboardEvent',
                key: event.code,
                event_type: 'release'
            };

            ws.send(JSON.stringify(keyboardEvent));
        }

        function disconnect() {
            if (ws) {
                const disconnectMessage = {
                    type: 'Disconnect'
                };
                ws.send(JSON.stringify(disconnectMessage));
                ws.close();
            }
            
            resetUI();
            showStatus('已断开连接', 'success');
        }

        function resetUI() {
            isConnected = false;
            document.getElementById('loginSection').style.display = 'block';
            document.getElementById('remoteDesktop').classList.remove('active');
            document.getElementById('loading').style.display = 'block';
            
            // 清除输入框
            document.getElementById('clientId').value = '';
            document.getElementById('authCode').value = '';
        }

        // 页面加载完成后的初始化
        window.addEventListener('load', function() {
            console.log('远程桌面控制页面已加载');
        });
    </script>
</body>
</html>
