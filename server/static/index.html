<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>远程桌面控制</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            padding: 2rem;
            width: 90%;
            max-width: 1200px;
        }

        .header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .header h1 {
            color: #333;
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
        }

        .header p {
            color: #666;
            font-size: 1.1rem;
        }

        .login-form {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            max-width: 400px;
            margin: 0 auto 2rem;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            margin-bottom: 0.5rem;
            color: #333;
            font-weight: 600;
        }

        .form-group input {
            padding: 0.75rem;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.3s ease;
        }

        .form-group input:focus {
            outline: none;
            border-color: #667eea;
        }

        .btn {
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        .btn-danger {
            background: linear-gradient(135deg, #ff6b6b 0%, #ee5a52 100%);
            color: white;
        }

        .btn-danger:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(255, 107, 107, 0.3);
        }

        .status {
            text-align: center;
            margin: 1rem 0;
            padding: 0.75rem;
            border-radius: 8px;
            font-weight: 600;
        }

        .status.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .status.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .remote-desktop {
            display: none;
            text-align: center;
        }

        .remote-desktop.active {
            display: block;
        }

        .desktop-container {
            position: relative;
            background: #000;
            border-radius: 8px;
            overflow: hidden;
            margin: 1rem 0;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .desktop-screen {
            width: 100%;
            height: auto;
            display: block;
            cursor: crosshair;
        }

        .loading {
            padding: 2rem;
            color: #666;
            font-size: 1.2rem;
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 1rem;
            margin-top: 1rem;
        }

        @media (max-width: 768px) {
            .container {
                padding: 1rem;
                margin: 1rem;
            }

            .header h1 {
                font-size: 2rem;
            }

            .controls {
                flex-direction: column;
                align-items: center;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🖥️ 远程桌面控制</h1>
            <p>输入客户端ID和验证码来远程控制桌面</p>
        </div>

        <div id="loginSection">
            <div class="login-form">
                <div class="form-group">
                    <label for="clientId">客户端ID:</label>
                    <input type="text" id="clientId" placeholder="请输入客户端ID" />
                </div>
                <div class="form-group">
                    <label for="authCode">验证码:</label>
                    <input type="password" id="authCode" placeholder="请输入验证码" />
                </div>
                <button class="btn btn-primary" onclick="connect()">连接</button>
            </div>
        </div>

        <div id="status" class="status" style="display: none;"></div>

        <div id="remoteDesktop" class="remote-desktop">
            <div class="desktop-container">
                <canvas id="desktopCanvas" class="desktop-screen"></canvas>
                <div id="loading" class="loading">正在连接远程桌面...</div>
            </div>
            <div class="controls">
                <button class="btn btn-danger" onclick="disconnect()">断开连接</button>
            </div>
        </div>
    </div>

    <script>
        let ws = null;
        let canvas = null;
        let ctx = null;
        let isConnected = false;

        // 用于存储完整的桌面图像和差分更新
        let desktopCanvas = null;
        let desktopCtx = null;
        
        // 性能监控
        let frameCount = 0;
        let lastStatsTime = Date.now();
        let renderTimes = [];
        
        // 渲染优化
        let isRendering = false;
        let pendingUpdate = false;
        let lastRenderTime = 0;
        const TARGET_FPS = 60;
        const FRAME_TIME = 1000 / TARGET_FPS;

        function showStatus(message, type = 'success') {
            const status = document.getElementById('status');
            status.textContent = message;
            status.className = `status ${type}`;
            status.style.display = 'block';
            
            setTimeout(() => {
                status.style.display = 'none';
            }, 3000);
        }

        function connect() {
            const clientId = document.getElementById('clientId').value.trim();
            const authCode = document.getElementById('authCode').value.trim();

            if (!clientId || !authCode) {
                showStatus('请输入客户端ID和验证码', 'error');
                return;
            }

            // 连接WebSocket服务器 - 使用/ws路径
            const wsUrl = `ws://${window.location.host}/ws`;
            ws = new WebSocket(wsUrl);

            ws.onopen = function() {
                console.log('WebSocket连接已建立');
                
                // 发送浏览器连接请求
                const connectRequest = {
                    type: 'BrowserConnect',
                    client_id: clientId,
                    auth_code: authCode
                };
                
                console.log('发送连接请求:', connectRequest);
                ws.send(JSON.stringify(connectRequest));
            };

            ws.onmessage = function(event) {
                try {
                    const message = JSON.parse(event.data);
                    handleMessage(message);
                } catch (e) {
                    console.error('解析消息失败:', e);
                }
            };

            ws.onclose = function() {
                console.log('WebSocket连接已关闭');
                if (isConnected) {
                    showStatus('连接已断开', 'error');
                    resetUI();
                }
            };

            ws.onerror = function(error) {
                console.error('WebSocket错误:', error);
                showStatus('连接失败', 'error');
            };
        }

        function handleMessage(message) {
            switch (message.type) {
                case 'Connected':
                    if (message.success) {
                        isConnected = true;
                        showStatus('连接成功', 'success');
                        showRemoteDesktop();
                        initCanvas();
                    } else {
                        showStatus(message.message, 'error');
                    }
                    break;

                case 'Error':
                    showStatus(message.message, 'error');
                    break;

                case 'ScreenData':
                    updateDesktop(message);
                    break;

                default:
                    console.log('未知消息类型:', message.type);
            }
        }

        function showRemoteDesktop() {
            document.getElementById('loginSection').style.display = 'none';
            document.getElementById('remoteDesktop').classList.add('active');
        }

        function initCanvas() {
            canvas = document.getElementById('desktopCanvas');
            ctx = canvas.getContext('2d');
            
            // 启用图像平滑处理
            ctx.imageSmoothingEnabled = true;
            ctx.imageSmoothingQuality = 'high';

            // 添加鼠标事件监听
            canvas.addEventListener('click', handleMouseClick);
            canvas.addEventListener('mousemove', throttle(handleMouseMove, 16)); // 限制到60fps
            canvas.addEventListener('contextmenu', e => e.preventDefault());
            
            // 添加键盘事件监听
            document.addEventListener('keydown', handleKeyDown);
            document.addEventListener('keyup', handleKeyUp);

            // 隐藏加载提示
            document.getElementById('loading').style.display = 'none';
            
            console.log('画布初始化完成，开始性能监控');
            startPerformanceMonitoring();
        }
        
        // 节流函数
        function throttle(func, limit) {
            let inThrottle;
            return function() {
                const args = arguments;
                const context = this;
                if (!inThrottle) {
                    func.apply(context, args);
                    inThrottle = true;
                    setTimeout(() => inThrottle = false, limit);
                }
            }
        }

        function updateDesktop(screenData) {
            const startTime = performance.now();
            
            // 初始化桌面画布（如果需要）
            if (!desktopCanvas) {
                desktopCanvas = document.createElement('canvas');
                desktopCtx = desktopCanvas.getContext('2d');
                // 启用硬件加速
                desktopCtx.imageSmoothingEnabled = false; // 差分更新不需要平滑
            }
            
            if (screenData.full_frame && screenData.image_data) {
                // 处理完整帧 - 高优先级，立即处理
                updateFullFrame(screenData, startTime);
                
            } else if (screenData.changed_regions && screenData.changed_regions.length > 0) {
                // 处理差分更新 - 优化版本
                updateDifferentialFrame(screenData, startTime);
                
            } else {
                // 没有变化的帧
                console.log('没有屏幕变化，跳过更新');
            }
        }

        function updateFullFrame(screenData, startTime) {
            console.log(`🖼️ 处理完整帧: ${screenData.width}x${screenData.height} (${screenData.format})`);
            
            const img = new Image();
            img.onload = function() {
                try {
                    // 更新画布尺寸
                    if (canvas.width !== screenData.width || canvas.height !== screenData.height) {
                        canvas.width = screenData.width;
                        canvas.height = screenData.height;
                        desktopCanvas.width = screenData.width;
                        desktopCanvas.height = screenData.height;
                        console.log(`画布尺寸已更新: ${screenData.width}x${screenData.height}`);
                    }
                    
                    // 直接绘制到离屏画布
                    desktopCtx.drawImage(img, 0, 0);
                    
                    // 立即更新显示
                    requestAnimationFrame(() => {
                        ctx.drawImage(desktopCanvas, 0, 0);
                        
                        const renderTime = performance.now() - startTime;
                        recordRenderTime(renderTime);
                        frameCount++;
                        
                        console.log(`✅ 完整帧渲染完成，耗时: ${renderTime.toFixed(2)}ms`);
                    });
                    
                } catch (error) {
                    console.error('完整帧渲染失败:', error);
                }
            };
            
            img.onerror = function() {
                console.error('❌ 完整帧图像加载失败');
            };
            
            // 设置图像源
            const mimeType = screenData.format === 'jpeg' ? 'image/jpeg' : 'image/png';
            img.src = `data:${mimeType};base64,${screenData.image_data}`;
        }

        function updateDifferentialFrame(screenData, startTime) {
            const regions = screenData.changed_regions;
            console.log(`🔄 处理差分更新: ${regions.length} 个区域`);
            
            let loadedRegions = 0;
            let hasError = false;
            const regionImages = [];
            
            // 批处理加载所有区域
            regions.forEach((region, index) => {
                const img = new Image();
                regionImages[index] = { img, region, loaded: false };
                
                img.onload = function() {
                    if (hasError) return;
                    
                    try {
                        // 立即绘制这个区域到离屏画布
                        desktopCtx.drawImage(img, region.x, region.y);
                        regionImages[index].loaded = true;
                        loadedRegions++;
                        
                        // 实时更新显示（不等待所有区域完成）
                        scheduleRender();
                        
                        // 所有区域完成时的日志
                        if (loadedRegions === regions.length) {
                            const renderTime = performance.now() - startTime;
                            recordRenderTime(renderTime);
                            frameCount++;
                            console.log(`✅ 差分更新完成: ${regions.length} 个区域，耗时: ${renderTime.toFixed(2)}ms`);
                        }
                        
                    } catch (error) {
                        console.error('差分区域绘制失败:', error);
                        hasError = true;
                    }
                };
                
                img.onerror = function() {
                    console.error(`❌ 差分区域加载失败:`, region);
                    hasError = true;
                };
                
                // 设置图像源
                img.src = `data:image/jpeg;base64,${region.data}`;
            });
        }
        
        // 智能渲染调度 - 避免过度重绘
        function scheduleRender() {
            if (isRendering) {
                pendingUpdate = true;
                return;
            }
            
            const now = performance.now();
            const elapsed = now - lastRenderTime;
            
            if (elapsed >= FRAME_TIME) {
                // 立即渲染
                performRender();
            } else {
                // 延迟到下一个合适的时机
                setTimeout(() => {
                    if (pendingUpdate) {
                        performRender();
                    }
                }, FRAME_TIME - elapsed);
            }
        }
        
        function performRender() {
            if (isRendering) return;
            
            isRendering = true;
            pendingUpdate = false;
            lastRenderTime = performance.now();
            
            requestAnimationFrame(() => {
                try {
                    ctx.drawImage(desktopCanvas, 0, 0);
                } catch (error) {
                    console.error('渲染失败:', error);
                } finally {
                    isRendering = false;
                    
                    // 如果有待处理的更新，继续处理
                    if (pendingUpdate) {
                        scheduleRender();
                    }
                }
            });
        }
        
        // 性能监控
        function recordRenderTime(time) {
            renderTimes.push(time);
            if (renderTimes.length > 100) {
                renderTimes.shift();
            }
        }
        
        function startPerformanceMonitoring() {
            setInterval(() => {
                const now = Date.now();
                const elapsed = now - lastStatsTime;
                
                if (elapsed >= 5000 && frameCount > 0) { // 每5秒报告一次
                    const fps = (frameCount * 1000 / elapsed).toFixed(1);
                    const avgRenderTime = renderTimes.length > 0 ? 
                        (renderTimes.reduce((a, b) => a + b, 0) / renderTimes.length).toFixed(2) : 0;
                    
                    console.log(`📊 性能统计 [5秒]:
🎯 渲染帧率: ${fps} FPS
⏱️ 平均渲染时间: ${avgRenderTime}ms
📦 总帧数: ${frameCount}`);
                    
                    // 重置计数器
                    frameCount = 0;
                    lastStatsTime = now;
                    renderTimes.length = 0;
                }
            }, 1000);
        }

        function handleMouseClick(event) {
            if (!isConnected || !ws) return;

            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            
            const x = (event.clientX - rect.left) * scaleX;
            const y = (event.clientY - rect.top) * scaleY;

            const mouseEvent = {
                type: 'MouseEvent',
                x: x,
                y: y,
                button: event.button === 0 ? 'left' : (event.button === 2 ? 'right' : 'middle'),
                event_type: 'click'
            };

            ws.send(JSON.stringify(mouseEvent));
        }

        function handleMouseMove(event) {
            if (!isConnected || !ws) return;

            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            
            const x = (event.clientX - rect.left) * scaleX;
            const y = (event.clientY - rect.top) * scaleY;

            const mouseEvent = {
                type: 'MouseEvent',
                x: x,
                y: y,
                button: 'none',
                event_type: 'move'
            };

            ws.send(JSON.stringify(mouseEvent));
        }

        function handleKeyDown(event) {
            if (!isConnected || !ws) return;

            event.preventDefault();

            const keyboardEvent = {
                type: 'KeyboardEvent',
                key: event.code,
                event_type: 'press'
            };

            ws.send(JSON.stringify(keyboardEvent));
        }

        function handleKeyUp(event) {
            if (!isConnected || !ws) return;

            event.preventDefault();

            const keyboardEvent = {
                type: 'KeyboardEvent',
                key: event.code,
                event_type: 'release'
            };

            ws.send(JSON.stringify(keyboardEvent));
        }

        function disconnect() {
            if (ws) {
                const disconnectMessage = {
                    type: 'Disconnect'
                };
                ws.send(JSON.stringify(disconnectMessage));
                ws.close();
            }
            
            resetUI();
            showStatus('已断开连接', 'success');
        }

        function resetUI() {
            isConnected = false;
            document.getElementById('loginSection').style.display = 'block';
            document.getElementById('remoteDesktop').classList.remove('active');
            document.getElementById('loading').style.display = 'block';
            
            // 清除输入框
            document.getElementById('clientId').value = '';
            document.getElementById('authCode').value = '';
            
            // 重置性能监控
            frameCount = 0;
            lastStatsTime = Date.now();
            renderTimes.length = 0;
        }

        // 页面加载完成后的初始化
        window.addEventListener('load', function() {
            console.log('🚀 远程桌面控制页面已加载 (性能优化版本)');
        });
    </script>
</body>
</html>
