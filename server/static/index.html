<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>远程桌面控制</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            padding: 2rem;
            width: 90%;
            max-width: 1200px;
        }

        .header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .header h1 {
            color: #333;
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
        }

        .header p {
            color: #666;
            font-size: 1.1rem;
        }

        .login-form {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            max-width: 400px;
            margin: 0 auto 2rem;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            margin-bottom: 0.5rem;
            color: #333;
            font-weight: 600;
        }

        .form-group input {
            padding: 0.75rem;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.3s ease;
        }

        .form-group input:focus {
            outline: none;
            border-color: #667eea;
        }

        .btn {
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        .btn-danger {
            background: linear-gradient(135deg, #ff6b6b 0%, #ee5a52 100%);
            color: white;
        }

        .btn-danger:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(255, 107, 107, 0.3);
        }

        .status {
            text-align: center;
            margin: 1rem 0;
            padding: 0.75rem;
            border-radius: 8px;
            font-weight: 600;
        }

        .status.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .status.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .remote-desktop {
            display: none;
            text-align: center;
        }

        .remote-desktop.active {
            display: block;
        }

        .desktop-container {
            position: relative;
            background: #000;
            border-radius: 8px;
            overflow: hidden;
            margin: 1rem 0;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .desktop-screen {
            width: 100%;
            height: auto;
            display: block;
            cursor: crosshair;
        }

        .loading {
            padding: 2rem;
            color: #666;
            font-size: 1.2rem;
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 1rem;
            margin-top: 1rem;
        }

        @media (max-width: 768px) {
            .container {
                padding: 1rem;
                margin: 1rem;
            }

            .header h1 {
                font-size: 2rem;
            }

            .controls {
                flex-direction: column;
                align-items: center;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🖥️ 远程桌面控制</h1>
            <p>输入客户端ID和验证码来远程控制桌面</p>
        </div>

        <div id="loginSection">
            <div class="login-form">
                <div class="form-group">
                    <label for="clientId">客户端ID:</label>
                    <input type="text" id="clientId" placeholder="请输入客户端ID" />
                </div>
                <div class="form-group">
                    <label for="authCode">验证码:</label>
                    <input type="password" id="authCode" placeholder="请输入验证码" />
                </div>
                <button class="btn btn-primary" onclick="connect()">连接</button>
            </div>
        </div>

        <div id="status" class="status" style="display: none;"></div>

        <div id="remoteDesktop" class="remote-desktop">
            <div class="desktop-container">
                <canvas id="desktopCanvas" class="desktop-screen"></canvas>
                <div id="loading" class="loading">正在连接远程桌面...</div>
            </div>
            <div class="controls">
                <button class="btn btn-danger" onclick="disconnect()">断开连接</button>
            </div>
        </div>
    </div>

    <script>
        let ws = null;
        let canvas = null;
        let ctx = null;
        let isConnected = false;

        // 用于存储完整的桌面图像和差分更新
        let desktopCanvas = null;
        let desktopCtx = null;
        
        // 性能监控变量
        let frameCount = 0;
        let lastStatsTime = Date.now();
        let renderTimes = [];
        let isRendering = false;
        let pendingUpdate = false;
        let lastRenderTime = 0;
        const FRAME_TIME = 16.67; // 60fps = 16.67ms per frame
        
        // 消息队列管理 - 解决消息堆积问题
        let messageQueue = [];
        let isProcessingQueue = false;
        let droppedFrames = 0;
        let totalMessages = 0;
        
        function showStatus(message, type = 'success') {
            const status = document.getElementById('status');
            status.textContent = message;
            status.className = `status ${type}`;
            status.style.display = 'block';
            
            setTimeout(() => {
                status.style.display = 'none';
            }, 3000);
        }

        function connect() {
            const clientId = document.getElementById('clientId').value.trim();
            const authCode = document.getElementById('authCode').value.trim();

            if (!clientId || !authCode) {
                showStatus('请输入客户端ID和验证码', 'error');
                return;
            }

            showStatus('正在连接...', 'info');

            ws = new WebSocket(`ws://${location.host}/ws`);

            ws.onopen = function() {
                console.log('WebSocket连接已建立');
                
                const connectMessage = {
                    type: 'BrowserConnect',
                    client_id: clientId,
                    auth_code: authCode
                };

                ws.send(JSON.stringify(connectMessage));
            };

            ws.onmessage = function(event) {
                try {
                    const message = JSON.parse(event.data);
                    totalMessages++;
                    
                    // 对ScreenData消息进行队列管理
                    if (message.type === 'ScreenData') {
                        handleScreenDataMessage(message);
                    } else {
                        handleMessage(message);
                    }
                } catch (error) {
                    console.error('消息解析失败:', error);
                }
            };

            ws.onclose = function() {
                console.log('WebSocket连接已关闭');
                showStatus('连接已断开', 'error');
                resetUI();
            };

            ws.onerror = function(error) {
                console.error('WebSocket错误:', error);
                showStatus('连接错误', 'error');
            };
        }
        
        // 优化的屏幕数据消息处理
        function handleScreenDataMessage(message) {
            // 智能消息队列管理
            if (message.full_frame) {
                // 完整帧：清除队列，立即处理
                messageQueue = [];
                messageQueue.push(message);
                processMessageQueue();
            } else if (message.changed_regions && message.changed_regions.length > 0) {
                // 差分帧：添加到队列
                messageQueue.push(message);
                
                // 队列管理：如果队列过长，丢弃旧帧
                if (messageQueue.length > 3) {  // 最多保留3帧
                    const dropped = messageQueue.shift();
                    droppedFrames++;
                    console.log(`⚠️ 丢弃旧帧避免堆积 (队列长度: ${messageQueue.length})`);
                }
                
                processMessageQueue();
            }
            // 忽略无变化的帧
        }
        
        // 异步处理消息队列
        async function processMessageQueue() {
            if (isProcessingQueue || messageQueue.length === 0) {
                return;
            }
            
            isProcessingQueue = true;
            
            try {
                while (messageQueue.length > 0) {
                    const message = messageQueue.shift();
                    await updateDesktopAsync(message);
                }
            } catch (error) {
                console.error('处理消息队列失败:', error);
            } finally {
                isProcessingQueue = false;
            }
        }
        
        // 异步版本的桌面更新
        async function updateDesktopAsync(screenData) {
            const startTime = performance.now();
            
            // 初始化桌面画布（如果需要）
            if (!desktopCanvas) {
                desktopCanvas = document.createElement('canvas');
                desktopCtx = desktopCanvas.getContext('2d');
                desktopCtx.imageSmoothingEnabled = false;
            }
            
            if (screenData.full_frame && screenData.image_data) {
                await updateFullFrameAsync(screenData, startTime);
            } else if (screenData.changed_regions && screenData.changed_regions.length > 0) {
                await updateDifferentialFrameAsync(screenData, startTime);
            }
        }
        
        // 异步完整帧更新
        function updateFullFrameAsync(screenData, startTime) {
            return new Promise((resolve, reject) => {
                console.log(`🖼️ 处理完整帧: ${screenData.width}x${screenData.height}`);
                
                const img = new Image();
                img.onload = function() {
                    try {
                        // 更新画布尺寸
                        if (canvas.width !== screenData.width || canvas.height !== screenData.height) {
                            canvas.width = screenData.width;
                            canvas.height = screenData.height;
                            desktopCanvas.width = screenData.width;
                            desktopCanvas.height = screenData.height;
                        }
                        
                        // 绘制到离屏画布
                        desktopCtx.drawImage(img, 0, 0);
                        
                        // 立即更新显示
                        scheduleRender();
                        
                        const renderTime = performance.now() - startTime;
                        recordRenderTime(renderTime);
                        frameCount++;
                        
                        console.log(`✅ 完整帧完成，耗时: ${renderTime.toFixed(2)}ms`);
                        resolve();
                        
                    } catch (error) {
                        console.error('完整帧渲染失败:', error);
                        reject(error);
                    }
                };
                
                img.onerror = () => {
                    console.error('❌ 完整帧图像加载失败');
                    reject(new Error('图像加载失败'));
                };
                
                const mimeType = screenData.format === 'jpeg' ? 'image/jpeg' : 'image/png';
                img.src = `data:${mimeType};base64,${screenData.image_data}`;
            });
        }
        
        // 优化的异步差分帧更新 - 并行加载
        function updateDifferentialFrameAsync(screenData, startTime) {
            return new Promise((resolve) => {
                const regions = screenData.changed_regions;
                console.log(`🔄 处理差分更新: ${regions.length} 个区域`);
                
                // 并行加载所有区域
                const promises = regions.map(region => loadRegionImage(region));
                
                // 等待所有区域加载完成
                Promise.allSettled(promises).then(results => {
                    let successCount = 0;
                    let errorCount = 0;
                    
                    // 绘制成功加载的区域
                    results.forEach((result, index) => {
                        if (result.status === 'fulfilled') {
                            const { img, region } = result.value;
                            try {
                                desktopCtx.drawImage(img, region.x, region.y);
                                successCount++;
                            } catch (error) {
                                console.error('绘制区域失败:', error);
                                errorCount++;
                            }
                        } else {
                            errorCount++;
                        }
                    });
                    
                    // 更新显示
                    scheduleRender();
                    
                    const renderTime = performance.now() - startTime;
                    recordRenderTime(renderTime);
                    frameCount++;
                    
                    console.log(`✅ 差分更新完成: ${successCount}/${regions.length} 区域，耗时: ${renderTime.toFixed(2)}ms`);
                    
                    if (errorCount > 0) {
                        console.warn(`⚠️ ${errorCount} 个区域加载失败`);
                    }
                    
                    resolve();
                });
            });
        }
        
        // 加载单个区域图像
        function loadRegionImage(region) {
            return new Promise((resolve, reject) => {
                const img = new Image();
                
                img.onload = () => resolve({ img, region });
                img.onerror = () => reject(new Error(`区域加载失败: ${region.x},${region.y}`));
                
                img.src = `data:image/jpeg;base64,${region.data}`;
            });
        }

        function handleMessage(message) {
            switch (message.type) {
                case 'Connected':
                    if (message.success) {
                        isConnected = true;
                        showStatus('连接成功', 'success');
                        showRemoteDesktop();
                        initCanvas();
                    } else {
                        showStatus(message.message, 'error');
                    }
                    break;

                case 'Error':
                    showStatus(message.message, 'error');
                    break;

                default:
                    console.log('未知消息类型:', message.type);
            }
        }

        function showRemoteDesktop() {
            document.getElementById('loginSection').style.display = 'none';
            document.getElementById('remoteDesktop').classList.add('active');
        }

        function initCanvas() {
            canvas = document.getElementById('desktopCanvas');
            ctx = canvas.getContext('2d');
            
            // 启用图像平滑处理
            ctx.imageSmoothingEnabled = true;
            ctx.imageSmoothingQuality = 'high';

            // 添加鼠标事件监听
            canvas.addEventListener('click', handleMouseClick);
            canvas.addEventListener('mousemove', throttle(handleMouseMove, 16)); // 限制到60fps
            canvas.addEventListener('contextmenu', e => e.preventDefault());
            
            // 添加键盘事件监听
            document.addEventListener('keydown', handleKeyDown);
            document.addEventListener('keyup', handleKeyUp);

            // 隐藏加载提示
            document.getElementById('loading').style.display = 'none';
            
            console.log('画布初始化完成，开始性能监控');
            startPerformanceMonitoring();
        }
        
        // 节流函数
        function throttle(func, limit) {
            let inThrottle;
            return function() {
                const args = arguments;
                const context = this;
                if (!inThrottle) {
                    func.apply(context, args);
                    inThrottle = true;
                    setTimeout(() => inThrottle = false, limit);
                }
            }
        }
        
        // 智能渲染调度 - 避免过度重绘
        function scheduleRender() {
            if (isRendering) {
                pendingUpdate = true;
                return;
            }
            
            const now = performance.now();
            const elapsed = now - lastRenderTime;
            
            if (elapsed >= FRAME_TIME) {
                // 立即渲染
                performRender();
            } else {
                // 延迟到下一个合适的时机
                setTimeout(() => {
                    if (pendingUpdate) {
                        performRender();
                    }
                }, FRAME_TIME - elapsed);
            }
        }
        
        function performRender() {
            if (isRendering) return;
            
            isRendering = true;
            pendingUpdate = false;
            lastRenderTime = performance.now();
            
            requestAnimationFrame(() => {
                try {
                    ctx.drawImage(desktopCanvas, 0, 0);
                } catch (error) {
                    console.error('渲染失败:', error);
                } finally {
                    isRendering = false;
                    
                    // 如果有待处理的更新，继续处理
                    if (pendingUpdate) {
                        scheduleRender();
                    }
                }
            });
        }
        
        // 性能监控
        function recordRenderTime(time) {
            renderTimes.push(time);
            if (renderTimes.length > 100) {
                renderTimes.shift();
            }
        }
        
        function startPerformanceMonitoring() {
            setInterval(() => {
                const now = Date.now();
                const elapsed = now - lastStatsTime;
                
                if (elapsed >= 5000 && frameCount > 0) {
                    const fps = (frameCount * 1000 / elapsed).toFixed(1);
                    const avgRenderTime = renderTimes.length > 0 ? 
                        (renderTimes.reduce((a, b) => a + b, 0) / renderTimes.length).toFixed(2) : 0;
                    
                    const queueEfficiency = totalMessages > 0 ? 
                        ((totalMessages - droppedFrames) / totalMessages * 100).toFixed(1) : 100;
                    
                    console.log(`📊 性能统计 [${elapsed/1000}秒]:
🎯 渲染帧率: ${fps} FPS
⏱️ 平均渲染时间: ${avgRenderTime}ms  
📦 总帧数: ${frameCount}
📨 消息效率: ${queueEfficiency}% (丢弃${droppedFrames}/${totalMessages})
🔄 队列长度: ${messageQueue.length}`);
                    
                    // 重置计数器
                    frameCount = 0;
                    lastStatsTime = now;
                    renderTimes.length = 0;
                    droppedFrames = 0;
                    totalMessages = 0;
                }
            }, 1000);
        }

        function handleMouseClick(event) {
            if (!isConnected || !ws) return;

            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            
            const x = (event.clientX - rect.left) * scaleX;
            const y = (event.clientY - rect.top) * scaleY;

            const mouseEvent = {
                type: 'MouseEvent',
                x: x,
                y: y,
                button: event.button === 0 ? 'left' : (event.button === 2 ? 'right' : 'middle'),
                event_type: 'click'
            };

            ws.send(JSON.stringify(mouseEvent));
        }

        function handleMouseMove(event) {
            if (!isConnected || !ws) return;

            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            
            const x = (event.clientX - rect.left) * scaleX;
            const y = (event.clientY - rect.top) * scaleY;

            const mouseEvent = {
                type: 'MouseEvent',
                x: x,
                y: y,
                button: 'none',
                event_type: 'move'
            };

            ws.send(JSON.stringify(mouseEvent));
        }

        function handleKeyDown(event) {
            if (!isConnected || !ws) return;

            event.preventDefault();

            const keyboardEvent = {
                type: 'KeyboardEvent',
                key: event.code,
                event_type: 'press'
            };

            ws.send(JSON.stringify(keyboardEvent));
        }

        function handleKeyUp(event) {
            if (!isConnected || !ws) return;

            event.preventDefault();

            const keyboardEvent = {
                type: 'KeyboardEvent',
                key: event.code,
                event_type: 'release'
            };

            ws.send(JSON.stringify(keyboardEvent));
        }

        function disconnect() {
            if (ws) {
                const disconnectMessage = {
                    type: 'Disconnect'
                };
                ws.send(JSON.stringify(disconnectMessage));
                ws.close();
            }
            
            resetUI();
            showStatus('已断开连接', 'success');
        }

        function resetUI() {
            isConnected = false;
            document.getElementById('loginSection').style.display = 'block';
            document.getElementById('remoteDesktop').classList.remove('active');
            document.getElementById('loading').style.display = 'block';
            
            // 清除输入框
            document.getElementById('clientId').value = '';
            document.getElementById('authCode').value = '';
            
            // 重置性能监控
            frameCount = 0;
            lastStatsTime = Date.now();
            renderTimes.length = 0;
        }

        // 页面加载完成后的初始化
        window.addEventListener('load', function() {
            console.log('🚀 远程桌面控制页面已加载 (性能优化版本)');
        });
    </script>
</body>
</html>
