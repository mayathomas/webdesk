# WebRTC ICE服务器配置
stun_servers:
  - url: "stun:stun.l.google.com:19302"
  - url: "stun:stun.cloudflare.com:3478"

turn_servers:
  # 我们自己的TURN服务器
  # - url: "turn:115.159.125.146:3478"
  # # - url: "turn:127.0.0.1:3478"
  #   username: "maya"
  #   credential: "sorrow2713"
  
  # 免费TURN服务器选项2: FreeTurn.net (德国，带宽限制)
  - url: "turn:freestun.net:3478"
    username: "free"
    credential: "free"

# WebRTC连接配置
rtc_config:
  ice_candidate_pool_size: 10
  bundle_policy: "max-bundle"
  rtcp_mux_policy: "require"

# HTTPS服务器配置
https_config:
  # 是否启用HTTPS
  enabled: false
  # HTTP端口
  http_port: 3000
  # HTTPS端口
  https_port: 3443
  # SSL证书文件路径
  cert_path: "cert.pem"
  # SSL私钥文件路径  
  key_path: "key.pem"
  # 是否自动生成自签名证书（开发模式）
  auto_generate_cert: true 