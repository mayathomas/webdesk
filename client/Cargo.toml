[package]
name = "remote-control-client"
version = "1.0.0"
edition = "2024"

# Tauri 2.0配置
[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
# 现有依赖
anyhow = "1.0"
tokio = { version = "1.0", features = ["full"] }
tokio-tungstenite = "0.20"
futures-util = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
url = "2.4"
rdev = "0.4"
base64 = "0.21"
image = "0.25"
fast_image_resize = "5.1"  # 高性能图像缩放库，支持SIMD
uuid = { version = "1.4", features = ["v4", "serde"] }
mac_address = "1.1"
directories = "5.0"
toml = "0.8"
rand = "0.8"
scrap = "0.5"

# 高性能并行处理
rayon = "1.8"
num_cpus = "1.16"

# WebRTC 相关依赖
webrtc = "0.11"
tokio-util = { version = "0.7", features = ["codec"] }
bytes = "1.0"

# Tauri 2.0依赖
tauri = { version = "2.0", features = ["tray-icon"] }
tauri-plugin-shell = "2.0"

# 日志依赖
log = { workspace = true }
env_logger = { workspace = true }

# Tauri特性
[features]
# 默认特性
default = ["custom-protocol"]
# 用于构建时的Tauri特性
custom-protocol = ["tauri/custom-protocol"]
