[workspace]
members = ["server", "client"]
resolver = "2"

[workspace.dependencies]
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.0", features = ["v4"] }
tokio-tungstenite = "0.21"
futures-util = "0.3"
anyhow = "1.0"
config = "0.14"
directories = "5.0"
mac_address = "1.1"
image = "0.24"
xcap = "0.6"
rdev = "0.4"
base64 = "0.22"
warp = "0.3"
# WebRTC 相关依赖
webrtc = "0.11"
tokio-util = { version = "0.7", features = ["codec"] }
bytes = "1.0" 