[workspace]
members = ["client", "turn-server", "stun-server", "signals-server"]
resolver = "2"

[workspace.dependencies]
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.0", features = ["v4"] }
tokio-tungstenite = "0.21"
futures-util = "0.3"
anyhow = "1.0"
config = "0.14"
directories = "5.0"
mac_address = "1.1"
image = "0.24"
xcap = "0.6"
rdev = "0.4"
base64 = "0.22"
warp = "0.3"
# WebRTC 相关依赖
webrtc = "0.11"
tokio-util = { version = "0.7", features = ["codec"] }
bytes = "1.0" 
# OpenH264 视频编码依赖
openh264 = "0.8.1"
openh264-sys2 = "0.8.1"
# 视频处理依赖
yuv = "0.1"
# 网络传输依赖
quinn = "0.10"
# 日志相关依赖
log = "0.4"
env_logger = "0.11" 
